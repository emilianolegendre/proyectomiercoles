<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión — AulaViva</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">

                <div class="logo-chip logo-school">
                    T
                </div>

                <div class="logo-chip logo-project">
                    4
                </div>

                <strong>
                    Tecnica<span style="color:#6d947d;">N4</span>
                </strong>

            </div>


            <div class="auth-eyebrow">
                AulaViva
            </div>


            <h1 class="auth-title">
                Iniciar sesión
            </h1>


            <p class="auth-subtitle">
                Entrá a tu cuenta para acceder al monitoreo.
            </p>


            <!--
                IMPORTANTE:
                El formulario manda los datos a login.php
            -->

            <form action="login.php" method="POST">


                <div class="form-group">

                    <label
                        class="form-label"
                        for="id_usuario">

                        Usuario

                    </label>

                    <input
                        class="form-control"
                        type="text"
                        id="id_usuario"
                        name="id_usuario"
                        placeholder="Ej: emiliano123"
                        required>

                </div>


                <div class="form-group">

                    <label
                        class="form-label"
                        for="password">

                        Contraseña

                    </label>

                    <input
                        class="form-control"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        required>

                </div>


                <button
                    class="btn-auth"
                    type="submit">

                    Iniciar sesión

                </button>


            </form>


            <div class="auth-footer">

                ¿No tenés una cuenta?

                <a href="registro.html">
                    Crear cuenta
                </a>

            </div>

        </section>

    </main>

</body>

</html>
